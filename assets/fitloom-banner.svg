<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto" role="img" aria-labelledby="fitloom-banner-title fitloom-banner-desc">
  <title id="fitloom-banner-title">FITLOOM — AI Fashion Intelligence &amp; Fit Calibration</title>
  <desc id="fitloom-banner-desc">Minimalist white, soft lavender, and violet fashion-tech banner for FITLOOM featuring subtle orbital measurement guides, geometric garment contours, and the tagline Find Your Fit. Define Your Style.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F7F5FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>

    <radialGradient id="violet-glow" cx="76%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#6633EE" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="soft-left-glow" cx="18%" cy="22%" r="36%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6633EE" stop-opacity="0"/>
      <stop offset="30%" stop-color="#6633EE" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#6633EE" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="prism-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6633EE" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Base Atmospheric Background -->
  <rect width="1200" height="360" rx="18" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" rx="18" fill="url(#violet-glow)"/>
  <rect width="1200" height="360" rx="18" fill="url(#soft-left-glow)"/>
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="#DDD6FE" stroke-width="1.5"/>

  <!-- Subtle Architectural Measurement Grid -->
  <g stroke="#C4B5FD" stroke-width="0.6" stroke-opacity="0.35">
    <line x1="72" y1="0" x2="72" y2="360"/>
    <line x1="1128" y1="0" x2="1128" y2="360"/>
    <line x1="0" y1="48" x2="1200" y2="48"/>
    <line x1="0" y1="312" x2="1200" y2="312"/>
  </g>

  <!-- Calibration Ruler Ticks (Top & Bottom) -->
  <g stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4">
    <line x1="120" y1="44" x2="120" y2="52"/>
    <line x1="200" y1="46" x2="200" y2="50"/>
    <line x1="280" y1="44" x2="280" y2="52"/>
    <line x1="360" y1="46" x2="360" y2="50"/>
    <line x1="440" y1="44" x2="440" y2="52"/>
    <line x1="520" y1="46" x2="520" y2="50"/>
    <line x1="600" y1="42" x2="600" y2="54"/>
    <line x1="120" y1="308" x2="120" y2="316"/>
    <line x1="280" y1="308" x2="280" y2="316"/>
    <line x1="440" y1="308" x2="440" y2="316"/>
    <line x1="600" y1="306" x2="600" y2="318"/>
  </g>

  <!-- Right-Side Orbital Fit Calibration Graphic -->
  <g transform="translate(925, 180)">
    <!-- Outer Orbital Ring -->
    <ellipse cx="0" cy="0" rx="165" ry="96" fill="none" stroke="#6633EE" stroke-width="1.2" stroke-opacity="0.28" stroke-dasharray="6 6" transform="rotate(-14)">
      <animateTransform attributeName="transform" type="rotate" from="-14 0 0" to="346 0 0" dur="48s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Secondary Orbital Ring -->
    <ellipse cx="0" cy="0" rx="126" ry="72" fill="none" stroke="#7C3AED" stroke-width="1.4" stroke-opacity="0.4" transform="rotate(18)">
      <animateTransform attributeName="transform" type="rotate" from="18 0 0" to="-342 0 0" dur="36s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Calibration Crosshair -->
    <g stroke="#6633EE" stroke-width="0.9" stroke-opacity="0.35">
      <line x1="-110" y1="0" x2="110" y2="0" stroke-dasharray="3 4"/>
      <line x1="0" y1="-110" x2="0" y2="110" stroke-dasharray="3 4"/>
      <circle cx="0" cy="0" r="88" fill="none" stroke-opacity="0.22"/>
    </g>

    <!-- Minimalist Geometric Garment Silhouette (Tailored Torso / Pattern Frame) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,-4; 0,4; 0,-4" dur="6s" repeatCount="indefinite"/>
      <path d="M -38 -52 L -16 -62 L 0 -54 L 16 -62 L 38 -52 L 54 -22 L 38 -14 L 30 -32 L 30 56 L -30 56 L -30 -32 L -38 -14 L -54 -22 Z"
            fill="url(#prism-grad)" stroke="#6633EE" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Measurement Fit Lines on Silhouette -->
      <line x1="-30" y1="-18" x2="30" y2="-18" stroke="#6633EE" stroke-width="1" stroke-dasharray="3 2" stroke-opacity="0.7"/>
      <line x1="-26" y1="12" x2="26" y2="12" stroke="#6633EE" stroke-width="1" stroke-dasharray="3 2" stroke-opacity="0.7"/>
      <circle cx="-30" cy="-18" r="2.6" fill="#6633EE"/>
      <circle cx="30" cy="-18" r="2.6" fill="#6633EE"/>
      <circle cx="-26" cy="12" r="2.6" fill="#7C3AED"/>
      <circle cx="26" cy="12" r="2.6" fill="#7C3AED"/>
    </g>

    <!-- Floating Orbiting Nodes -->
    <circle cx="148" cy="-34" r="4" fill="#6633EE" fill-opacity="0.85">
      <animate attributeName="opacity" values="0.45;0.95;0.45" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-132" cy="42" r="3.5" fill="#8B5CF6" fill-opacity="0.8">
      <animate attributeName="opacity" values="0.85;0.35;0.85" dur="5s" repeatCount="indefinite"/>
    </circle>
    <polygon points="86,-74 93,-64 86,-54 79,-64" fill="#6633EE" fill-opacity="0.25" stroke="#6633EE" stroke-width="1"/>
  </g>

  <!-- Left-Side Editorial Typography Block -->
  <g transform="translate(88, 92)">
    <!-- Eyebrow Pill -->
    <rect x="0" y="0" width="236" height="26" rx="13" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1"/>
    <circle cx="16" cy="13" r="4" fill="#6633EE">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="17" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#4C1D95">HACK N PITCH · E-SUMMIT '26</text>

    <!-- Bold FITLOOM Wordmark -->
    <text x="-2" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="4" fill="#111827">FITLOOM</text>

    <!-- Accent Rule -->
    <rect x="0" y="114" width="380" height="2.5" rx="1.25" fill="url(#accent-line)"/>

    <!-- Main Headline -->
    <text x="0" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1E1B4B">AI Fashion Intelligence &amp; Fit Calibration</text>

    <!-- Supporting Tagline -->
    <text x="0" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0.4" fill="#4B5563">Find Your Fit. Define Your Style.</text>
  </g>

  <!-- Subtle Bottom Corner Metadata -->
  <text x="1110" y="336" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="1" fill="#6D28D9" fill-opacity="0.75">TEAM PARADOX · JADAVPUR UNIVERSITY</text>
</svg>

